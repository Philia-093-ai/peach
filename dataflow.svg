<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6fa5"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9a9a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f2937">peach 数据流图（MVP）｜数据从哪来、到哪去</text>

  <!-- ===== 四个主体框 ===== -->
  <!-- 用户 -->
  <rect x="30" y="90" width="150" height="150" rx="10" fill="#f5f7fa" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="105" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">用户</text>
  <text x="105" y="150" text-anchor="middle" font-size="12" fill="#4b5563">选场景</text>
  <text x="105" y="172" text-anchor="middle" font-size="12" fill="#4b5563">输入关键词</text>
  <text x="105" y="194" text-anchor="middle" font-size="12" fill="#4b5563">点「生成」</text>
  <text x="105" y="216" text-anchor="middle" font-size="12" fill="#4b5563">看结果 / 复制</text>

  <!-- 前端 -->
  <rect x="260" y="90" width="200" height="150" rx="10" fill="#eef4fb" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="360" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">前端（浏览器里跑）</text>
  <text x="360" y="144" text-anchor="middle" font-size="12" fill="#374151">index.html：表单 + 结果区</text>
  <text x="360" y="166" text-anchor="middle" font-size="12" fill="#374151">校验：非空、≤ 20 字</text>
  <text x="360" y="188" text-anchor="middle" font-size="12" fill="#374151">检查每日额度（读计数）</text>
  <text x="360" y="210" text-anchor="middle" font-size="12" fill="#374151">展示结果卡片、复制按钮</text>

  <!-- 后端 -->
  <rect x="540" y="90" width="200" height="150" rx="10" fill="#eef7f0" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="640" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">后端（服务器上跑）</text>
  <text x="640" y="144" text-anchor="middle" font-size="12" fill="#374151">/api/generate 一个接口</text>
  <text x="640" y="166" text-anchor="middle" font-size="12" fill="#374151">持有 API Key（不进前端）</text>
  <text x="640" y="188" text-anchor="middle" font-size="12" fill="#374151">拼提示词、10 秒超时控制</text>
  <text x="640" y="210" text-anchor="middle" font-size="12" fill="#374151">把模型返回裁成「名字+寓意」</text>

  <!-- AI -->
  <rect x="810" y="90" width="120" height="150" rx="10" fill="#fbf3e8" stroke="#c77d1f" stroke-width="1.5"/>
  <text x="870" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">AI 模型 API</text>
  <text x="870" y="148" text-anchor="middle" font-size="12" fill="#4b5563">文本生成</text>
  <text x="870" y="170" text-anchor="middle" font-size="12" fill="#4b5563">按量付费</text>
  <text x="870" y="192" text-anchor="middle" font-size="12" fill="#4b5563">供应商 Day 6 定</text>

  <!-- localStorage -->
  <g>
    <ellipse cx="360" cy="308" rx="88" ry="12" fill="#dbe8fb" stroke="#1a73e8" stroke-width="1.5"/>
    <rect x="272" y="308" width="176" height="40" fill="#dbe8fb" stroke="#1a73e8" stroke-width="1.5"/>
    <rect x="272" y="308" width="176" height="40" fill="none" stroke="none"/>
    <path d="M 272 308 L 272 348 M 448 308 L 448 348" stroke="#1a73e8" stroke-width="1.5" fill="none"/>
    <ellipse cx="360" cy="348" rx="88" ry="12" fill="#dbe8fb" stroke="#1a73e8" stroke-width="1.5"/>
    <rect x="274" y="310" width="172" height="36" fill="#dbe8fb"/>
    <text x="360" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3f7a">localStorage 额度计数</text>
  </g>

  <!-- ===== 请求方向箭头（上 lane, y=130） ===== -->
  <line x1="180" y1="130" x2="256" y2="130" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="218" y="112" text-anchor="middle" font-size="12" fill="#374151">① 场景 + 关键词</text>

  <line x1="460" y1="130" x2="536" y2="130" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="498" y="112" text-anchor="middle" font-size="12" fill="#374151">③ 生成请求</text>

  <line x1="740" y1="130" x2="806" y2="130" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="773" y="112" text-anchor="middle" font-size="12" fill="#374151">④ 带 Key 调用</text>

  <!-- ===== 返回方向箭头（下 lane, y=205） ===== -->
  <line x1="806" y1="205" x2="744" y2="205" stroke="#2e8b57" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="773" y="228" text-anchor="middle" font-size="12" fill="#374151">⑤ 原始文本</text>

  <line x1="536" y1="205" x2="464" y2="205" stroke="#2e8b57" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="498" y="228" text-anchor="middle" font-size="12" fill="#374151">⑥ 名字+寓意 列表</text>

  <line x1="256" y1="205" x2="184" y2="205" stroke="#2e8b57" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="218" y="228" text-anchor="middle" font-size="12" fill="#374151">⑦ 结果卡片</text>

  <!-- 失败虚线 -->
  <path d="M 300 240 C 240 280, 200 270, 140 246" stroke="#9a9a9a" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#arrowGray)"/>
  <text x="205" y="268" text-anchor="middle" font-size="11.5" fill="#8a8a8a">失败 / 超时：提示重试，不扣额度</text>

  <!-- 前端 ↔ localStorage -->
  <line x1="330" y1="244" x2="330" y2="292" stroke="#1a73e8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="322" y="272" text-anchor="end" font-size="11.5" fill="#1a3f7a">② 读今日次数</text>
  <line x1="396" y1="292" x2="396" y2="248" stroke="#1a73e8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="406" y="272" text-anchor="start" font-size="11.5" fill="#1a3f7a">成功后 +1 存回</text>

  <!-- ===== 底部总结条 ===== -->
  <rect x="30" y="392" width="900" height="84" rx="10" fill="#f5f7fa" stroke="#d0d5dd" stroke-width="1"/>
  <text x="55" y="424" font-size="14" font-weight="bold" fill="#1f2937">数据从哪来：</text>
  <text x="180" y="424" font-size="13" fill="#374151">用户的「场景 + 关键词」（浏览器表单）；模型 API 的返回文本（服务器收）</text>
  <text x="55" y="456" font-size="14" font-weight="bold" fill="#1f2937">数据到哪去：</text>
  <text x="180" y="456" font-size="13" fill="#374151">结果卡片展示给用户（前端）；额度计数写进 localStorage（浏览器本地，不进服务器）</text>
</svg>
