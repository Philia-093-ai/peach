<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>peach · 中文名字生成器</title>
  <!-- Day 11：补一个内联 SVG 图标（🍑 和站标一致）。之前浏览器每次自动请求 /favicon.ico 都 404，
       控制台一直有一条报错；用 data URI 不用加新文件，404 消失，测试"零报错"才干净 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍑</text></svg>">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div class="logo">🍑</div>
      <p class="site">peach · AI 小工具站</p>
      <h1>中文名字生成器</h1>
      <p class="slogan">写下你的想法，10 秒拿到一批带寓意的名字——不注册，打开就用。</p>
    </header>

    <form id="form" class="panel" autocomplete="off">
      <label class="field">
        <span class="label">用在哪儿</span>
        <select id="scene">
          <option value="品牌" selected>品牌</option>
          <option value="店铺">店铺</option>
          <option value="宠物">宠物</option>
          <option value="网络昵称">网络昵称</option>
        </select>
      </label>

      <label class="field">
        <span class="label">关键词 <em>（1–20 个字，说说想表达什么）</em></span>
        <input id="keyword" type="text" maxlength="40" placeholder="例如：海边咖啡店，安静治愈">
      </label>

      <button id="btn" type="submit">✨ 生成名字</button>
      <p id="hint" class="hint" role="alert"></p>
    </form>

    <section class="results">
      <div class="results-head">
        <h2>生成结果</h2>
        <span id="quota" class="quota"></span>
      </div>
      <!-- Day 12：筛选条（按名字字数）。
           role="group" 告诉读屏"这是一组同类按钮"；计数文字用 role="status" + aria-live="polite"，
           筛选一变就读出"筛选出几个"，不靠眼睛数卡片。
           整行默认 hidden：只有手里真有数据时才显示（规则见 .workbuddy/skills/filter-check/SKILL.md） -->
      <div class="filter-row" id="filter-row" hidden>
        <div id="filters" class="filters" role="group" aria-label="按名字字数筛选"></div>
        <p id="result-count" class="result-count" role="status" aria-live="polite"></p>
      </div>
      <div id="results">
        <div class="card sample">
          <div class="name">浪屿</div>
          <div class="meaning">示例：关键词「海边咖啡店，安静治愈」→ 想象一座海上的小岛，安静得只听得见浪。</div>
          <div class="sample-note">👆 这是示例。填好上方的表单，点「生成名字」就能拿到你的第一批。</div>
        </div>
      </div>
    </section>

    <footer class="foot">
      每日免费生成 5 次 · 明天自动恢复 · peach（Day 8 mock 数据版）
    </footer>
  </main>

  <script src="/card.js"></script>
  <script src="/filter.js"></script>
  <script src="/mock.js"></script>
  <script src="/app.js"></script>
</body>
</html>
